# Postgres + Airflow (daily crawl) + API + desk screen.  Copy .env.example to .env first.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shelfwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shelfwatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelfwatch}"]
      interval: 5s
      retries: 10

  airflow:
    build: {context: ., dockerfile: Dockerfile.airflow}
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-shelfwatch}:${POSTGRES_PASSWORD}@postgres/shelfwatch
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
      SHELFWATCH_DB: postgresql://${POSTGRES_USER:-shelfwatch}:${POSTGRES_PASSWORD}@postgres/shelfwatch
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes: [./dags:/opt/airflow/dags]
    ports: ["8080:8080"]
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin
      --lastname User --role Admin --email admin@example.com || true &&
      (airflow scheduler &) && airflow webserver"

  api:
    build: .
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      SHELFWATCH_DB: postgresql://${POSTGRES_USER:-shelfwatch}:${POSTGRES_PASSWORD}@postgres/shelfwatch
      SHELFWATCH_API_KEYS: ${SHELFWATCH_API_KEYS:-}
    ports: ["8000:8000"]

  app:
    build: .
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      SHELFWATCH_DB: postgresql://${POSTGRES_USER:-shelfwatch}:${POSTGRES_PASSWORD}@postgres/shelfwatch
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]

volumes:
  pgdata:
